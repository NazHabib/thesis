rules:
  - rule_id: "SAFETY-0001"
    rule_version: "1.0.1"
    name: "General information and the clinician’s role"
    group: "SAFETY"
    priority: 10
    condition: "notna(SEQN) or isna(SEQN)"
    missing_policy: "na_true"
    severity: "low"
    action_type: "inform"
    action_code: "INFORM_SYSTEM_SCOPE"
    tags: ["system", "scope", "audit"]
    suppresses: []
    conflict_group: "GLOBAL_SYSTEM_MESSAGE"
    conflict_policy: "keep_strongest"
    explanation_template: "This system provides supportive recommendations (deterministic and guideline-based), but does not replace clinical evaluation. If you have concerning symptoms, please seek medical care."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/"
    provenance: 
      note: "System scope statement; aligns with guideline-driven decision support framing."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "SAFETY-0002"
    rule_version: "1.0.1"
    name: "Out of scope: under 18 years or unknown age"
    group: "SAFETY"
    priority: 980
    condition: "isna(Adult18plus_flag) or Adult18plus_flag == 0"
    missing_policy: "na_false"
    severity: "high"
    action_type: "escalate"
    action_code: "ESCALATE_OUT_OF_SCOPE_NONADULT"
    tags: ["safety", "scope", "age"]
    suppresses:
      - "INFORM_BP_MEASUREMENT_LIMITED"
      - "INFORM_DIET_RECALL_NOT_RELIABLE"
      - "INFORM_DIET_DATA_MISSING"
      - "INFORM_BP_METHOD_INFERRED"
      - "INFORM_DATA_MISSING_KEY_METRICS"
      - "ESCALATE_EMERGENCY_HTN_DM"
      - "ESCALATE_HTN_CRISIS"
      - "ESCALATE_SEVERE_HYPERGLYCEMIA"
      - "ESCALATE_HTN_MARKEDLY_ELEVATED"
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
      - "RECOMMEND_BP_SELF_MONITORING"
      - "RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE"
      - "RECOMMEND_DIABETES_REVIEW_ABOVE_TARGET"
      - "RECOMMEND_DIABETES_REVIEW_POOR_CONTROL"
      - "RECOMMEND_PREDIABETES_LIFESTYLE"
      - "INFORM_NORMAL_GLYCEMIA_PREVENTION"
      - "ESCALATE_SEVERE_OBESITY_INTENSIVE_REFERRAL"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OBESITY"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OVERWEIGHT"
      - "INFORM_CENTRAL_OBESITY_RISK"
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_MVPA_START_GRADUAL"
      - "RECOMMEND_REDUCE_SEDENTARY_TIME"
      - "INFORM_OLDER_ADULTS_BALANCE_STRENGTH"
      - "RECOMMEND_SMOKING_CESSATION"
      - "INFORM_FORMER_SMOKER_REINFORCE"
      - "RECOMMEND_REDUCE_ALCOHOL"
      - "RECOMMEND_LIPIDS_HIGH_TC_LIFESTYLE"
      - "INFORM_LIPIDS_BORDERLINE_TC"
      - "RECOMMEND_LIPIDS_LOW_HDL_LIFESTYLE"
      - "RECOMMEND_INTEGRATED_CARDIOMETABOLIC_PLAN"
      - "ESCALATE_MULTI_MORBIDITY_HIGH_SEVERITY"
      - "RECOMMEND_LIFESTYLE_RISK_BUNDLE"
    conflict_group: "OUT_OF_SCOPE"
    conflict_policy: "keep_strongest"
    explanation_template: "Your data suggests age <18 years (or unknown). This system was designed for adults (≥18). Referral to a healthcare team is recommended."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/"
    provenance: 
      note: "Safety scope constraint for adult-focused cardiometabolic recommendations."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0101"
    rule_version: "1.0.1"
    name: "Data quality: few BP readings (BP_n_used < 2)"
    group: "DATA_QUALITY"
    priority: 450
    condition: "Adult18plus_flag == 1 and (isna(BP_n_used) or BP_n_used < 2)"
    missing_policy: "na_false"
    severity: "moderate"
    action_type: "inform"
    action_code: "INFORM_BP_MEASUREMENT_LIMITED"
    tags: ["data_quality", "bp", "nhanes"]
    suppresses:
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
    conflict_group: "DATA_QUALITY_BP"
    conflict_policy: "keep_strongest"
    explanation_template: "There are few blood pressure measurements available for this visit (ideally ≥2). Interpret the blood pressure categories with caution and confirm with repeated measurements/monitoring."
    citations:
      - "https://wwwn.cdc.gov/nchs/data/nhanes/public/2021/manuals/2021-BloodPressureProcedures-508.pdf"
      - "https://professional.heart.org/en/science-news/-/media/597477e610c64866bdde138e1729066d.ashx"
    provenance: 
      note: "NHANES BP procedures + ACC/AHA emphasis on averaging readings for classification/diagnosis."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0102"
    rule_version: "1.0.1"
    name: "Data quality: unreliable dietary recall Day 1 (DR1DRSTZ==2)"
    group: "DATA_QUALITY"
    priority: 460
    condition: "Adult18plus_flag == 1 and ((notna(DR1DRSTZ) and DR1DRSTZ == 2) or (notna(DietDay1_reliable_flag) and DietDay1_reliable_flag == 0))"
    missing_policy: "na_false"
    severity: "moderate"
    action_type: "inform"
    action_code: "INFORM_DIET_RECALL_NOT_RELIABLE"
    tags: ["data_quality", "diet", "nhanes"]
    suppresses:
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_REDUCE_ALCOHOL"
    conflict_group: "DATA_QUALITY_DIET"
    conflict_policy: "keep_strongest"
    explanation_template: "The 24-hour dietary recall (Day 1) does not meet minimum reliability criteria in this sample. Dietary recommendations have been suppressed; consider additional data collection/evaluation."
    citations:
      - "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DR1TOT_L.htm"
    provenance: 
      note: "NHANES DR1DRSTZ definition: code 2 = not reliable/incomplete."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0103"
    rule_version: "1.0.1"
    name: "Data quality: inferred BP method"
    group: "DATA_QUALITY"
    priority: 210
    condition: "Adult18plus_flag == 1 and notna(BP_method_inferred) and BP_method_inferred == 1"
    missing_policy: "na_false"
    severity: "low"
    action_type: "inform"
    action_code: "INFORM_BP_METHOD_INFERRED"
    tags: ["data_quality", "bp"]
    suppresses: []
    conflict_group: "DATA_QUALITY_BP_METHOD"
    conflict_policy: "keep_strongest"
    explanation_template: "The blood pressure measurement method was inferred (not explicitly recorded). Use this information with caution in audits/interpretation."
    citations:
      - "https://wwwn.cdc.gov/nchs/data/nhanes/public/2021/manuals/2021-BloodPressureProcedures-508.pdf"
    provenance: 
      note: "Pipeline-derived BP method; anchored to NHANES BP measurement documentation."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0104"
    rule_version: "1.0.1"
    name: "Data quality: missing key metrics (SBP/DBP/HbA1c/BMI)"
    group: "DATA_QUALITY"
    priority: 320
    condition: "Adult18plus_flag == 1 and (isna(SBP_mean) or isna(DBP_mean) or isna(LBXGH) or isna(BMXBMI))"
    missing_policy: "na_false"
    severity: "moderate"
    action_type: "inform"
    action_code: "INFORM_DATA_MISSING_KEY_METRICS"
    tags: ["data_quality", "missingness"]
    suppresses: []
    conflict_group: "DATA_QUALITY_GENERAL"
    conflict_policy: "keep_strongest"
    explanation_template: "There are essential cardiometabolic metrics missing (mean systolic/diastolic blood pressure, HbA1c and/or BMI). Some recommendations may not be generated; consider additional data collection/evaluation."
    citations:
      - "https://professional.heart.org/en/science-news/-/media/597477e610c64866bdde138e1729066d.ashx"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/"
      - "https://www.cdc.gov/bmi/adult-calculator/bmi-categories.html"
    provenance: 
      note: "Missingness audit rule to avoid over-interpretation; references key measurement domains."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0105"
    rule_version: "1.0.1"
    name: "Data quality: missing dietary recall Day 1 (DR1DRSTZ==5 or NA)"
    group: "DATA_QUALITY"
    priority: 430
    condition: "Adult18plus_flag == 1 and (isna(DR1DRSTZ) or (notna(DR1DRSTZ) and DR1DRSTZ == 5))"
    missing_policy: "na_false"
    severity: "low"
    action_type: "inform"
    action_code: "INFORM_DIET_DATA_MISSING"
    tags: ["data_quality", "diet", "nhanes"]
    suppresses:
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_REDUCE_ALCOHOL"
    conflict_group: "DATA_QUALITY_DIET"
    conflict_policy: "keep_strongest"
    explanation_template: "There is no complete 24-hour dietary recall (Day 1) available. Dietary recommendations (including alcohol) have not been calculated."
    citations:
      - "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DR1TOT_L.htm"
    provenance: 
      note: "NHANES DR1DRSTZ definition: code 5 = not done."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "ACUTE-0201"
    rule_version: "1.0.1"
    name: "Combined emergency: hypertensive crisis + severe hyperglycemia"
    group: "SAFETY"
    priority: 1100
    condition: "Adult18plus_flag == 1 and (((notna(SBP_mean) and SBP_mean >= 180) or (notna(DBP_mean) and DBP_mean >= 120) or (notna(Hypertensive_crisis_flag) and Hypertensive_crisis_flag == 1)) and ((notna(LBXGH) and LBXGH >= 10) or (notna(Severe_hyperglycemia_flag) and Severe_hyperglycemia_flag == 1)))"
    missing_policy: "na_false"
    severity: "critical"
    action_type: "escalate"
    action_code: "ESCALATE_EMERGENCY_HTN_DM"
    tags: ["acute", "safety", "htn", "diabetes"]
    suppresses:
      - "ESCALATE_HTN_CRISIS"
      - "ESCALATE_SEVERE_HYPERGLYCEMIA"
      - "ESCALATE_HTN_MARKEDLY_ELEVATED"
      - "INFORM_BP_MEASUREMENT_LIMITED"
      - "INFORM_DIET_RECALL_NOT_RELIABLE"
      - "INFORM_DIET_DATA_MISSING"
      - "INFORM_BP_METHOD_INFERRED"
      - "INFORM_DATA_MISSING_KEY_METRICS"
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
      - "RECOMMEND_BP_SELF_MONITORING"
      - "RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE"
      - "RECOMMEND_DIABETES_REVIEW_ABOVE_TARGET"
      - "RECOMMEND_DIABETES_REVIEW_POOR_CONTROL"
      - "RECOMMEND_PREDIABETES_LIFESTYLE"
      - "INFORM_NORMAL_GLYCEMIA_PREVENTION"
      - "ESCALATE_SEVERE_OBESITY_INTENSIVE_REFERRAL"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OBESITY"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OVERWEIGHT"
      - "INFORM_CENTRAL_OBESITY_RISK"
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_MVPA_START_GRADUAL"
      - "RECOMMEND_REDUCE_SEDENTARY_TIME"
      - "INFORM_OLDER_ADULTS_BALANCE_STRENGTH"
      - "RECOMMEND_SMOKING_CESSATION"
      - "INFORM_FORMER_SMOKER_REINFORCE"
      - "RECOMMEND_REDUCE_ALCOHOL"
      - "RECOMMEND_LIPIDS_HIGH_TC_LIFESTYLE"
      - "INFORM_LIPIDS_BORDERLINE_TC"
      - "RECOMMEND_LIPIDS_LOW_HDL_LIFESTYLE"
      - "RECOMMEND_INTEGRATED_CARDIOMETABOLIC_PLAN"
      - "ESCALATE_MULTI_MORBIDITY_HIGH_SEVERITY"
      - "RECOMMEND_LIFESTYLE_RISK_BUNDLE"
    conflict_group: "ACUTE_EMERGENCY"
    conflict_policy: "keep_strongest"
    explanation_template: "Values suggest a hypertensive crisis and severe hyperglycemia. Seek urgent/emergency evaluation (112). Do not delay care."
    citations:
      - "https://www.heart.org/en/health-topics/high-blood-pressure/when-high-blood-pressure-is-an-emergency"
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690185/"
    provenance: 
      note: "Safety-first escalation combining ACC/AHA hypertensive crisis thresholds and ADA severe hyperglycemia guidance (A1C >10%)."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "HTNACUTE-0202"
    rule_version: "1.0.1"
    name: "Hypertensive crisis: critical escalation"
    group: "HTN_ACUTE"
    priority: 1050
    condition: "Adult18plus_flag == 1 and ((notna(SBP_mean) and SBP_mean >= 180) or (notna(DBP_mean) and DBP_mean >= 120) or (notna(Hypertensive_crisis_flag) and Hypertensive_crisis_flag == 1))"
    missing_policy: "na_false"
    severity: "critical"
    action_type: "escalate"
    action_code: "ESCALATE_HTN_CRISIS"
    tags: ["acute", "htn", "crisis"]
    suppresses:
      - "ESCALATE_HTN_MARKEDLY_ELEVATED"
      - "INFORM_BP_MEASUREMENT_LIMITED"
      - "INFORM_DIET_RECALL_NOT_RELIABLE"
      - "INFORM_DIET_DATA_MISSING"
      - "INFORM_BP_METHOD_INFERRED"
      - "INFORM_DATA_MISSING_KEY_METRICS"
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
      - "RECOMMEND_BP_SELF_MONITORING"
      - "RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE"
      - "RECOMMEND_DIABETES_REVIEW_ABOVE_TARGET"
      - "RECOMMEND_DIABETES_REVIEW_POOR_CONTROL"
      - "RECOMMEND_PREDIABETES_LIFESTYLE"
      - "INFORM_NORMAL_GLYCEMIA_PREVENTION"
      - "ESCALATE_SEVERE_OBESITY_INTENSIVE_REFERRAL"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OBESITY"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OVERWEIGHT"
      - "INFORM_CENTRAL_OBESITY_RISK"
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_MVPA_START_GRADUAL"
      - "RECOMMEND_REDUCE_SEDENTARY_TIME"
      - "INFORM_OLDER_ADULTS_BALANCE_STRENGTH"
      - "RECOMMEND_SMOKING_CESSATION"
      - "INFORM_FORMER_SMOKER_REINFORCE"
      - "RECOMMEND_REDUCE_ALCOHOL"
      - "RECOMMEND_LIPIDS_HIGH_TC_LIFESTYLE"
      - "INFORM_LIPIDS_BORDERLINE_TC"
      - "RECOMMEND_LIPIDS_LOW_HDL_LIFESTYLE"
      - "RECOMMEND_INTEGRATED_CARDIOMETABOLIC_PLAN"
      - "ESCALATE_MULTI_MORBIDITY_HIGH_SEVERITY"
      - "RECOMMEND_LIFESTYLE_RISK_BUNDLE"
    conflict_group: "ACUTE_EMERGENCY"
    conflict_policy: "keep_strongest"
    explanation_template: "Very high blood pressure can be urgent. If you have chest pain, shortness of breath, neurological deficit, confusion or severe symptoms, call 112 and seek immediate help."
    citations:
      - "https://www.heart.org/en/health-topics/high-blood-pressure/when-high-blood-pressure-is-an-emergency"
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: 
      note: "ACC/AHA hypertensive crisis escalation pattern; symptom guidance for emergency response."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DMACUTE-0203"
    rule_version: "1.0.1"
    name: "Severe hyperglycemia (HbA1c ≥10%): critical escalation"
    group: "DIABETES_ACUTE"
    priority: 1030
    condition: "Adult18plus_flag == 1 and ((notna(LBXGH) and LBXGH >= 10) or (notna(Severe_hyperglycemia_flag) and Severe_hyperglycemia_flag == 1))"
    missing_policy: "na_false"
    severity: "critical"
    action_type: "escalate"
    action_code: "ESCALATE_SEVERE_HYPERGLYCEMIA"
    tags: ["acute", "diabetes", "hyperglycemia"]
    suppresses:
      - "INFORM_BP_MEASUREMENT_LIMITED"
      - "INFORM_DIET_RECALL_NOT_RELIABLE"
      - "INFORM_DIET_DATA_MISSING"
      - "INFORM_BP_METHOD_INFERRED"
      - "INFORM_DATA_MISSING_KEY_METRICS"
      - "RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE"
      - "RECOMMEND_DIABETES_REVIEW_ABOVE_TARGET"
      - "RECOMMEND_DIABETES_REVIEW_POOR_CONTROL"
      - "RECOMMEND_PREDIABETES_LIFESTYLE"
      - "INFORM_NORMAL_GLYCEMIA_PREVENTION"
      - "ESCALATE_SEVERE_OBESITY_INTENSIVE_REFERRAL"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OBESITY"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OVERWEIGHT"
      - "INFORM_CENTRAL_OBESITY_RISK"
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_MVPA_START_GRADUAL"
      - "RECOMMEND_REDUCE_SEDENTARY_TIME"
      - "INFORM_OLDER_ADULTS_BALANCE_STRENGTH"
      - "RECOMMEND_SMOKING_CESSATION"
      - "INFORM_FORMER_SMOKER_REINFORCE"
      - "RECOMMEND_REDUCE_ALCOHOL"
      - "RECOMMEND_LIPIDS_HIGH_TC_LIFESTYLE"
      - "INFORM_LIPIDS_BORDERLINE_TC"
      - "RECOMMEND_LIPIDS_LOW_HDL_LIFESTYLE"
      - "RECOMMEND_INTEGRATED_CARDIOMETABOLIC_PLAN"
      - "ESCALATE_MULTI_MORBIDITY_HIGH_SEVERITY"
      - "RECOMMEND_LIFESTYLE_RISK_BUNDLE"
    conflict_group: "ACUTE_EMERGENCY"
    conflict_policy: "keep_strongest"
    explanation_template: "Severe hyperglycemia (HbA1c ≥10%) suggests critical illness and risk of decompensation. Urgent clinical evaluation is recommended (treatment adjustments may be needed)."
    citations:
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690185/"
    provenance: 
      note: "ADA Standards of Care 2026: consider insulin initiation when A1C >10% or glucose very high (used here as urgent clinical review trigger, not prescribing)."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "HTNACUTE-0204"
    rule_version: "1.0.1"
    name: "Very high blood pressure (not a crisis): brief clinical review"
