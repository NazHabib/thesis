rules:
  - rule_id: SAFETY-0001
    rule_version: "1.0.0"
    name: "Âmbito e limitação do assistente"
    group: SAFETY
    priority: 15
    condition: "notna(SEQN) or isna(SEQN)"
    missing_policy: na_true
    severity: low
    action_type: inform
    action_code: INFORM_SYSTEM_SCOPE
    tags: ["safety", "disclaimer", "not_a_diagnosis", "audit"]
    suppresses: []
    conflict_group: GLOBAL_SAFETY_MESSAGING
    conflict_policy: keep_strongest
    explanation_template: "Este sistema dá recomendações de apoio com base em dados disponíveis e diretrizes gerais. Não substitui a avaliação do seu médico/enfermeiro."
    citations:
      - "Thesis safety-layer principle (project documentation)"
    provenance: "Safety framing; deterministic assistant layer (do not replace clinicians)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: SAFETY-0002
    rule_version: "1.0.0"
    name: "Fora do âmbito: não adulto"
    group: SAFETY
    priority: 970
    condition: "isna(Adult18plus_flag) or Adult18plus_flag == 0"
    missing_policy: na_false
    severity: high
    action_type: escalate
    action_code: ESCALATE_OUT_OF_SCOPE_NONADULT
    tags: ["safety", "scope", "pediatrics", "triage"]
    suppresses: []
    conflict_group: OUT_OF_SCOPE
    conflict_policy: keep_strongest
    explanation_template: "As regras deste assistente foram desenhadas para adultos. Para menores de 18 anos, a interpretação e recomendações devem ser feitas por um profissional de saúde com orientações pediátricas."
    citations:
      - "Pediatric BP guidance differs; keep out-of-scope (design constraint)"
    provenance: "Scope guardrail (adult-only ruleset)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DATA-0101
    rule_version: "1.0.0"
    name: "Qualidade de dados: poucas medições de pressão arterial"
    group: DATA_QUALITY
    priority: 420
    condition: "Adult18plus_flag == 1 and (isna(BP_n_used) or BP_n_used < 2)"
    missing_policy: na_false
    severity: moderate
    action_type: inform
    action_code: INFORM_BP_MEASUREMENT_LIMITED
    tags: ["data_quality", "blood_pressure", "measurement", "nhanes"]
    suppresses: ["RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M", "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M", "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M", "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"]
    conflict_group: DATA_QUALITY_BP
    conflict_policy: keep_strongest
    explanation_template: "A classificação da sua pressão arterial tem menor confiança porque existem poucas medições válidas. Idealmente, confirme com novas medições (em consulta ou em casa, com técnica correta)."
    citations:
      - "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/1999/DataFiles/BPX.htm"
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "NHANES BP measurement averaging + guideline emphasis on repeated measures"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DATA-0102
    rule_version: "1.0.0"
    name: "Qualidade de dados: recordatório alimentar não fiável"
    group: DATA_QUALITY
    priority: 380
    condition: "Adult18plus_flag == 1 and (isna(DietDay1_reliable_flag) or DietDay1_reliable_flag == 0 or (notna(DR1DRSTZ) and DR1DRSTZ != 1))"
    missing_policy: na_false
    severity: moderate
    action_type: inform
    action_code: INFORM_DIET_RECALL_NOT_RELIABLE
    tags: ["data_quality", "diet", "nhanes", "AMPM"]
    suppresses: ["RECOMMEND_SODIUM_REDUCTION_2300", "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL", "INFORM_VERY_HIGH_SODIUM", "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY", "RECOMMEND_REDUCE_SATURATED_FAT", "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN", "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS", "RECOMMEND_REDUCE_ALCOHOL"]
    conflict_group: DATA_QUALITY_DIET
    conflict_policy: keep_strongest
    explanation_template: "O seu recordatório alimentar (dia 1) pode não ser suficientemente fiável para tirar conclusões. As recomendações de alimentação devem ser confirmadas com dados mais consistentes ou avaliação por nutricionista."
    citations:
      - "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DR1IFF_L.htm"
      - "https://www.ars.usda.gov/ARSUserFiles/80400530/pdf/1718/Key%20Points%20Using%20WWEIA%20NHANES%202017-2018.pdf"
    provenance: "NHANES dietary recall status (DR1DRSTZ) and reliability gating"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DATA-0103
    rule_version: "1.0.0"
    name: "Qualidade de dados: método de PA inferido"
    group: DATA_QUALITY
    priority: 130
    condition: "Adult18plus_flag == 1 and notna(BP_method_inferred) and BP_method_inferred == 1"
    missing_policy: na_false
    severity: low
    action_type: inform
    action_code: INFORM_BP_METHOD_INFERRED
    tags: ["data_quality", "provenance", "blood_pressure"]
    suppresses: []
    conflict_group: DATA_QUALITY_BP
    conflict_policy: keep_strongest
    explanation_template: "Nota: o método da medição de pressão arterial foi inferido a partir dos dados disponíveis. Interprete as comparações com cautela."
    citations:
      - "Internal dataset provenance: BP_method_inferred"
    provenance: "Transparency about measurement provenance"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DATA-0104
    rule_version: "1.0.0"
    name: "Qualidade de dados: métricas essenciais em falta"
    group: DATA_QUALITY
    priority: 260
    condition: "Adult18plus_flag == 1 and (isna(SBP_mean) or isna(DBP_mean) or isna(LBXGH) or isna(BMXBMI))"
    missing_policy: na_false
    severity: moderate
    action_type: inform
    action_code: INFORM_DATA_MISSING_KEY_METRICS
    tags: ["data_quality", "missingness", "safety"]
    suppresses: []
    conflict_group: DATA_QUALITY_GENERAL
    conflict_policy: keep_strongest
    explanation_template: "Faltam alguns dados essenciais (ex.: pressão arterial média, HbA1c ou IMC). Isso limita recomendações específicas; considere completar medições/avaliação clínica."
    citations:
      - "Design: fail-safe under missingness"
    provenance: "Fail-safe rule: reduce specificity when key inputs absent"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: ACUTE-0201
    rule_version: "1.0.0"
    name: "Emergência combinada: PA muito elevada + HbA1c muito elevada"
    group: SAFETY
    priority: 1100
    condition: "Adult18plus_flag == 1 and ((notna(SBP_mean) and SBP_mean >= 180) or (notna(DBP_mean) and DBP_mean >= 120) or (notna(Hypertensive_crisis_flag) and Hypertensive_crisis_flag == 1)) and ((notna(LBXGH) and LBXGH >= 10) or (notna(Severe_hyperglycemia_flag) and Severe_hyperglycemia_flag == 1))"
    missing_policy: na_false
    severity: critical
    action_type: escalate
    action_code: ESCALATE_EMERGENCY_HTN_DM
    tags: ["emergency", "hypertension", "diabetes", "safety_first"]
    suppresses: ["ESCALATE_HTN_CRISIS", "ESCALATE_SEVERE_HYPERGLYCEMIA"]
    conflict_group: ACUTE_EMERGENCY
    conflict_policy: keep_strongest
    explanation_template: "Há sinais de risco elevado que justificam avaliação urgente (pressão arterial muito alta e HbA1c muito alta). Procure assistência médica urgente/serviço de urgência."
    citations:
      - "https://www.heart.org/en/health-topics/high-blood-pressure/understanding-blood-pressure-readings/when-to-call-911-for-high-blood-pressure"
      - "https://diabetesjournals.org/care/article/48/Supplement_1/S181/157569/9-Pharmacologic-Approaches-to-Glycemic-Treatment"
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "AHA crisis threshold + ADA severe hyperglycemia marker; combined triage to reduce duplicate critical alerts"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTNACUTE-0202
    rule_version: "1.0.0"
    name: "Crise hipertensiva (triagem por limiar)"
    group: HTN_ACUTE
    priority: 1050
    condition: "Adult18plus_flag == 1 and ((notna(SBP_mean) and SBP_mean >= 180) or (notna(DBP_mean) and DBP_mean >= 120) or (notna(Hypertensive_crisis_flag) and Hypertensive_crisis_flag == 1))"
    missing_policy: na_false
    severity: critical
    action_type: escalate
    action_code: ESCALATE_HTN_CRISIS
    tags: ["hypertension", "crisis", "emergency"]
    suppresses: ["RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M", "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M", "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M", "RECOMMEND_MVPA_START_GRADUAL", "RECOMMEND_REDUCE_SEDENTARY_TIME", "RECOMMEND_SODIUM_REDUCTION_2300", "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL", "RECOMMEND_REDUCE_ALCOHOL"]
    conflict_group: ACUTE_EMERGENCY
    conflict_policy: keep_strongest
    explanation_template: "A sua pressão arterial está muito elevada. Isto pode ser uma urgência/emergência. Procure avaliação médica urgente (especialmente se houver sintomas como dor no peito, falta de ar, fraqueza ou alterações da visão)."
    citations:
      - "https://www.heart.org/en/health-topics/high-blood-pressure/understanding-blood-pressure-readings/when-to-call-911-for-high-blood-pressure"
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "Hypertensive crisis threshold; symptoms not available => conservative escalation"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DMACUTE-0203
    rule_version: "1.0.0"
    name: "Hiperglicemia muito marcada por HbA1c"
    group: DIABETES_ACUTE
    priority: 1030
    condition: "Adult18plus_flag == 1 and ((notna(LBXGH) and LBXGH >= 10) or (notna(Severe_hyperglycemia_flag) and Severe_hyperglycemia_flag == 1))"
    missing_policy: na_false
    severity: critical
    action_type: escalate
    action_code: ESCALATE_SEVERE_HYPERGLYCEMIA
    tags: ["diabetes", "a1c", "severe", "safety_first"]
    suppresses: ["RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE", "RECOMMEND_MVPA_START_GRADUAL"]
    conflict_group: ACUTE_EMERGENCY
    conflict_policy: keep_strongest
    explanation_template: "A HbA1c está muito elevada, o que sugere dificuldade significativa no controlo glicémico. Deve contactar um profissional de saúde com urgência para avaliação e plano personalizado."
    citations:
      - "https://diabetesjournals.org/care/article/48/Supplement_1/S181/157569/9-Pharmacologic-Approaches-to-Glycemic-Treatment"
      - "https://diabetesjournals.org/care/article/48/Supplement_1/S27/157566/2-Diagnosis-and-Classification-of-Diabetes"
    provenance: "ADA uses A1c >10% as severe hyperglycemia marker in clinical algorithms; engine uses for triage only (no prescribing)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTNACUTE-0204
    rule_version: "1.0.0"
    name: "PA muito elevada (não crise) — avaliação breve"
    group: HTN_ACUTE
    priority: 900
    condition: "Adult18plus_flag == 1 and notna(SBP_mean) and notna(DBP_mean) and SBP_mean < 180 and DBP_mean < 120 and (SBP_mean >= 160 or DBP_mean >= 100)"
    missing_policy: na_false
    severity: high
    action_type: escalate
    action_code: ESCALATE_HTN_MARKEDLY_ELEVATED
    tags: ["hypertension", "markedly_elevated", "follow_up"]
    suppresses: ["RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"]
    conflict_group: HTN_URGENCY
    conflict_policy: keep_strongest
    explanation_template: "A sua pressão arterial está bastante elevada. Mesmo sem sinais de emergência, recomenda-se contacto clínico em breve para confirmar medições e definir um plano."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "Risk stratification within HTN; conservative triage"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTN-0301
    rule_version: "1.0.0"
    name: "HTA estádio 2 — caminho de seguimento"
    group: HTN_MANAGEMENT
    priority: 760
    condition: "Adult18plus_flag == 1 and notna(BP_n_used) and BP_n_used >= 2 and notna(SBP_mean) and notna(DBP_mean) and SBP_mean < 180 and DBP_mean < 120 and (SBP_mean >= 140 or DBP_mean >= 90)"
    missing_policy: na_false
    severity: high
    action_type: recommend
    action_code: RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M
    tags: ["hypertension", "stage2", "follow_up", "lifestyle"]
    suppresses: ["RECOMMEND_HTN_ST1_LIFESTYLE_3_6M", "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M", "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"]
    conflict_group: HTN_BP_CATEGORY
    conflict_policy: keep_strongest
    explanation_template: "A média da sua pressão arterial está na gama de hipertensão (estádio 2). Recomenda-se uma consulta/seguimento próximo (≈1 mês) para confirmar valores e definir plano. Comece/continue mudanças de estilo de vida (sal, peso, atividade, álcool)."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "ACC/AHA 2017 categories and follow-up timing (highlights table)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTN-0302
    rule_version: "1.0.0"
    name: "HTA estádio 1 com diabetes — seguimento mais próximo"
    group: HTN_MANAGEMENT
    priority: 640
    condition: "Adult18plus_flag == 1 and notna(BP_n_used) and BP_n_used >= 2 and notna(SBP_mean) and notna(DBP_mean) and SBP_mean < 140 and DBP_mean < 90 and ((between(SBP_mean, 130, 139)) or (between(DBP_mean, 80, 89))) and notna(Diabetes) and Diabetes == 1"
    missing_policy: na_false
    severity: moderate
    action_type: recommend
    action_code: RECOMMEND_HTN_ST1_LIFESTYLE_3_6M
    tags: ["hypertension", "stage1", "diabetes", "lifestyle"]
    suppresses: ["RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M", "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"]
    conflict_group: HTN_BP_CATEGORY
    conflict_policy: keep_strongest
    explanation_template: "A sua pressão arterial está na gama de hipertensão (estádio 1) e existe diabetes. Recomenda-se reforço de estilo de vida e seguimento clínico (por vezes mais cedo) para reduzir risco cardiometabólico."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "ACC/AHA highlights: stage 1 with diabetes is higher-risk pathway (engine avoids med advice; keeps follow-up emphasis)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTN-0303
    rule_version: "1.0.0"
    name: "HTA estádio 1 sem diabetes — lifestyle e reavaliação"
    group: HTN_MANAGEMENT
    priority: 600
    condition: "Adult18plus_flag == 1 and notna(BP_n_used) and BP_n_used >= 2 and notna(SBP_mean) and notna(DBP_mean) and SBP_mean < 140 and DBP_mean < 90 and ((between(SBP_mean, 130, 139)) or (between(DBP_mean, 80, 89))) and (isna(Diabetes) or Diabetes == 0)"
    missing_policy: na_false
    severity: moderate
    action_type: recommend
    action_code: RECOMMEND_HTN_ST1_LIFESTYLE_3_6M
    tags: ["hypertension", "stage1", "lifestyle"]
    suppresses: ["RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M", "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"]
    conflict_group: HTN_BP_CATEGORY
    conflict_policy: keep_strongest
    explanation_template: "A sua pressão arterial está na gama de hipertensão (estádio 1). Mudanças de estilo de vida (sal, atividade, peso, álcool, tabaco) e reavaliação em ~3–6 meses podem ajudar."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "ACC/AHA stage 1 pathway (low-risk variant; no ASCVD available => conservative lifestyle emphasis)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTN-0304
    rule_version: "1.0.0"
    name: "PA elevada — prevenção"
    group: HTN_MANAGEMENT
    priority: 410
    condition: "Adult18plus_flag == 1 and notna(BP_n_used) and BP_n_used >= 2 and notna(SBP_mean) and notna(DBP_mean) and between(SBP_mean, 120, 129) and DBP_mean < 80"
    missing_policy: na_false
    severity: low
    action_type: recommend
    action_code: RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M
    tags: ["blood_pressure", "elevated", "prevention"]
    suppresses: ["INFORM_BP_NORMAL_MAINTAIN_ANNUAL"]
    conflict_group: HTN_BP_CATEGORY
    conflict_policy: keep_strongest
    explanation_template: "A sua pressão arterial está ‘elevada’ (ainda não hipertensão). Pequenas mudanças (menos sal, mais atividade, peso saudável, menos álcool) e reavaliação em ~3–6 meses são recomendadas."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "ACC/AHA elevated BP category + follow-up window"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTN-0305
    rule_version: "1.0.0"
    name: "PA normal — manutenção"
    group: HTN_MANAGEMENT
    priority: 120
    condition: "Adult18plus_flag == 1 and notna(BP_n_used) and BP_n_used >= 2 and notna(SBP_mean) and notna(DBP_mean) and SBP_mean < 120 and DBP_mean < 80"
    missing_policy: na_false
    severity: low
    action_type: inform
    action_code: INFORM_BP_NORMAL_MAINTAIN_ANNUAL
    tags: ["blood_pressure", "prevention"]
    suppresses: []
    conflict_group: HTN_BP_CATEGORY
    conflict_policy: keep_strongest
    explanation_template: "A sua pressão arterial está em valores normais. Mantenha hábitos saudáveis e faça monitorização/avaliação periódica (por exemplo, anual)."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "ACC/AHA normal BP category and general follow-up"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: HTN-0306
    rule_version: "1.0.0"
    name: "Self-monitoring de PA (educação)"
    group: HTN_MANAGEMENT
    priority: 260
    condition: "Adult18plus_flag == 1 and notna(SBP_mean) and notna(DBP_mean) and ((SBP_mean >= 120) or (DBP_mean >= 80))"
    missing_policy: na_false
    severity: low
    action_type: recommend
    action_code: RECOMMEND_BP_SELF_MONITORING
    tags: ["blood_pressure", "self_monitoring", "education"]
    suppresses: []
    conflict_group: HTN_SELF_MONITORING
    conflict_policy: keep_strongest
    explanation_template: "Considere monitorizar a pressão arterial também fora da consulta (em casa), com aparelho validado e técnica correta. Isto ajuda a confirmar valores e acompanhar o plano."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
    provenance: "Guideline highlights emphasize accurate measurement and self-monitoring"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DM-0401
    rule_version: "1.0.0"
    name: "Diabetes por HbA1c — base de auto-gestão"
    group: DIABETES_MANAGEMENT
    priority: 560
    condition: "Adult18plus_flag == 1 and notna(LBXGH) and LBXGH >= 6.5 and LBXGH < 10"
    missing_policy: na_false
    severity: moderate
    action_type: recommend
    action_code: RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE
    tags: ["diabetes", "a1c", "self_management"]
    suppresses: []
    conflict_group: DIABETES_CORE
    conflict_policy: keep_strongest
    explanation_template: "A HbA1c está na gama da diabetes. Recomenda-se seguimento regular e um plano de estilo de vida (alimentação, atividade física, peso, sono e tabaco) ajustado com a sua equipa de saúde."
    citations:
      - "https://diabetesjournals.org/care/article/48/Supplement_1/S27/157566/2-Diagnosis-and-Classification-of-Diabetes"
      - "https://diabetesjournals.org/care/article/48/Supplement_1/S128/157561/6-Glycemic-Goals-and-Hypoglycemia-Standards-of"
    provenance: "ADA diagnostic threshold + glycemic goals as context; no medication guidance"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DM-0402
    rule_version: "1.0.0"
    name: "Diabetes: controlo glicémico subótimo (HbA1c >= 9)"
    group: DIABETES_MANAGEMENT
    priority: 780
    condition: "Adult18plus_flag == 1 and notna(LBXGH) and LBXGH >= 9 and LBXGH < 10"
    missing_policy: na_false
    severity: high
    action_type: recommend
    action_code: RECOMMEND_DIABETES_POOR_CONTROL_REVIEW
    tags: ["diabetes", "a1c", "follow_up", "poor_control"]
    suppresses: []
    conflict_group: DIABETES_GLYCEMIC_SEVERITY
    conflict_policy: keep_strongest
    explanation_template: "A HbA1c está elevada, sugerindo controlo glicémico subótimo. Recomenda-se revisão clínica em breve para ajustar objetivos e plano diário."
    citations:
      - "https://diabetesjournals.org/care/article/48/Supplement_1/S128/157561/6-Glycemic-Goals-and-Hypoglycemia-Standards-of"
    provenance: "ADA emphasizes individualized goals; higher A1c suggests need for review (no prescribing)"
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: DM-0403
    rule_version: "1.0.0"
    name: "Diabetes: HbA1c acima do objetivo típico (>= 7)"
