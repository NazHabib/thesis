rules:
  - rule_id: "SAFETY-0001"
    rule_version: "1.0.1"
    name: "Informação de âmbito e não-substituição do clínico"
    group: "SAFETY"
    priority: 10
    condition: "notna(SEQN) or isna(SEQN)"
    missing_policy: "na_true"
    severity: "low"
    action_type: "inform"
    action_code: "INFORM_SYSTEM_SCOPE"
    tags: ["system", "scope", "audit"]
    suppresses: []
    conflict_group: "GLOBAL_SYSTEM_MESSAGE"
    conflict_policy: "keep_strongest"
    explanation_template: "Este sistema fornece recomendações de apoio (determinísticas e baseadas em diretrizes), não substitui avaliação clínica. Se tiver sintomas preocupantes, procure cuidados de saúde."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/"
    provenance: 
      note: "System scope statement; aligns with guideline-driven decision support framing."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "SAFETY-0002"
    rule_version: "1.0.1"
    name: "Fora de âmbito: menor de 18 anos ou idade desconhecida"
    group: "SAFETY"
    priority: 980
    condition: "isna(Adult18plus_flag) or Adult18plus_flag == 0"
    missing_policy: "na_false"
    severity: "high"
    action_type: "escalate"
    action_code: "ESCALATE_OUT_OF_SCOPE_NONADULT"
    tags: ["safety", "scope", "age"]
    suppresses:
      - "INFORM_BP_MEASUREMENT_LIMITED"
      - "INFORM_DIET_RECALL_NOT_RELIABLE"
      - "INFORM_DIET_DATA_MISSING"
      - "INFORM_BP_METHOD_INFERRED"
      - "INFORM_DATA_MISSING_KEY_METRICS"
      - "ESCALATE_EMERGENCY_HTN_DM"
      - "ESCALATE_HTN_CRISIS"
      - "ESCALATE_SEVERE_HYPERGLYCEMIA"
      - "ESCALATE_HTN_MARKEDLY_ELEVATED"
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
      - "RECOMMEND_BP_SELF_MONITORING"
      - "RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE"
      - "RECOMMEND_DIABETES_REVIEW_ABOVE_TARGET"
      - "RECOMMEND_DIABETES_REVIEW_POOR_CONTROL"
      - "RECOMMEND_PREDIABETES_LIFESTYLE"
      - "INFORM_NORMAL_GLYCEMIA_PREVENTION"
      - "ESCALATE_SEVERE_OBESITY_INTENSIVE_REFERRAL"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OBESITY"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OVERWEIGHT"
      - "INFORM_CENTRAL_OBESITY_RISK"
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_MVPA_START_GRADUAL"
      - "RECOMMEND_REDUCE_SEDENTARY_TIME"
      - "INFORM_OLDER_ADULTS_BALANCE_STRENGTH"
      - "RECOMMEND_SMOKING_CESSATION"
      - "INFORM_FORMER_SMOKER_REINFORCE"
      - "RECOMMEND_REDUCE_ALCOHOL"
      - "RECOMMEND_LIPIDS_HIGH_TC_LIFESTYLE"
      - "INFORM_LIPIDS_BORDERLINE_TC"
      - "RECOMMEND_LIPIDS_LOW_HDL_LIFESTYLE"
      - "RECOMMEND_INTEGRATED_CARDIOMETABOLIC_PLAN"
      - "ESCALATE_MULTI_MORBIDITY_HIGH_SEVERITY"
      - "RECOMMEND_LIFESTYLE_RISK_BUNDLE"
    conflict_group: "OUT_OF_SCOPE"
    conflict_policy: "keep_strongest"
    explanation_template: "Os seus dados sugerem idade <18 anos (ou desconhecida). Este motor foi desenhado para adultos (≥18). Recomenda-se avaliação/seguimento com equipa de saúde."
    citations:
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/"
    provenance: 
      note: "Safety scope constraint for adult-focused cardiometabolic recommendations."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0101"
    rule_version: "1.0.1"
    name: "Qualidade de dados: poucas leituras de PA (BP_n_used < 2)"
    group: "DATA_QUALITY"
    priority: 450
    condition: "Adult18plus_flag == 1 and (isna(BP_n_used) or BP_n_used < 2)"
    missing_policy: "na_false"
    severity: "moderate"
    action_type: "inform"
    action_code: "INFORM_BP_MEASUREMENT_LIMITED"
    tags: ["data_quality", "bp", "nhanes"]
    suppresses:
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
    conflict_group: "DATA_QUALITY_BP"
    conflict_policy: "keep_strongest"
    explanation_template: "Há poucas medições de pressão arterial disponíveis nesta visita (idealmente ≥2). Interprete as categorias de PA com cautela e confirme com medições repetidas/monitorização."
    citations:
      - "https://wwwn.cdc.gov/nchs/data/nhanes/public/2021/manuals/2021-BloodPressureProcedures-508.pdf"
      - "https://professional.heart.org/en/science-news/-/media/597477e610c64866bdde138e1729066d.ashx"
    provenance: 
      note: "NHANES BP procedures + ACC/AHA emphasis on averaging readings for classification/diagnosis."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0102"
    rule_version: "1.0.1"
    name: "Qualidade de dados: recordatório alimentar Day 1 não fiável (DR1DRSTZ==2)"
    group: "DATA_QUALITY"
    priority: 460
    condition: "Adult18plus_flag == 1 and ((notna(DR1DRSTZ) and DR1DRSTZ == 2) or (notna(DietDay1_reliable_flag) and DietDay1_reliable_flag == 0))"
    missing_policy: "na_false"
    severity: "moderate"
    action_type: "inform"
    action_code: "INFORM_DIET_RECALL_NOT_RELIABLE"
    tags: ["data_quality", "diet", "nhanes"]
    suppresses:
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_REDUCE_ALCOHOL"
    conflict_group: "DATA_QUALITY_DIET"
    conflict_policy: "keep_strongest"
    explanation_template: "O recordatório alimentar de 24h (dia 1) não atinge critérios mínimos de fiabilidade nesta amostra. As recomendações alimentares foram suprimidas; considere recolha/avaliação adicional."
    citations:
      - "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DR1TOT_L.htm"
    provenance: 
      note: "NHANES DR1DRSTZ definition: code 2 = not reliable/incomplete."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0103"
    rule_version: "1.0.1"
    name: "Qualidade de dados: método de PA inferido"
    group: "DATA_QUALITY"
    priority: 210
    condition: "Adult18plus_flag == 1 and notna(BP_method_inferred) and BP_method_inferred == 1"
    missing_policy: "na_false"
    severity: "low"
    action_type: "inform"
    action_code: "INFORM_BP_METHOD_INFERRED"
    tags: ["data_quality", "bp"]
    suppresses: []
    conflict_group: "DATA_QUALITY_BP_METHOD"
    conflict_policy: "keep_strongest"
    explanation_template: "O método/dispositivo de medição da pressão arterial foi inferido (não explicitamente registado). Use esta informação com cautela em auditoria/interpretação."
    citations:
      - "https://wwwn.cdc.gov/nchs/data/nhanes/public/2021/manuals/2021-BloodPressureProcedures-508.pdf"
    provenance: 
      note: "Pipeline-derived BP method; anchored to NHANES BP measurement documentation."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0104"
    rule_version: "1.0.1"
    name: "Qualidade de dados: métricas-chave em falta (PA/HbA1c/BMI)"
    group: "DATA_QUALITY"
    priority: 320
    condition: "Adult18plus_flag == 1 and (isna(SBP_mean) or isna(DBP_mean) or isna(LBXGH) or isna(BMXBMI))"
    missing_policy: "na_false"
    severity: "moderate"
    action_type: "inform"
    action_code: "INFORM_DATA_MISSING_KEY_METRICS"
    tags: ["data_quality", "missingness"]
    suppresses: []
    conflict_group: "DATA_QUALITY_GENERAL"
    conflict_policy: "keep_strongest"
    explanation_template: "Existem métricas cardiometabólicas essenciais em falta (pressão arterial média, HbA1c e/ou IMC). Algumas recomendações podem não ser geradas; considerar recolha/validação."
    citations:
      - "https://professional.heart.org/en/science-news/-/media/597477e610c64866bdde138e1729066d.ashx"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/"
      - "https://www.cdc.gov/bmi/adult-calculator/bmi-categories.html"
    provenance: 
      note: "Missingness audit rule to avoid over-interpretation; references key measurement domains."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "DATA-0105"
    rule_version: "1.0.1"
    name: "Qualidade de dados: recordatório alimentar Day 1 não realizado/indisponível (DR1DRSTZ==5 ou NA)"
    group: "DATA_QUALITY"
    priority: 430
    condition: "Adult18plus_flag == 1 and (isna(DR1DRSTZ) or (notna(DR1DRSTZ) and DR1DRSTZ == 5))"
    missing_policy: "na_false"
    severity: "low"
    action_type: "inform"
    action_code: "INFORM_DIET_DATA_MISSING"
    tags: ["data_quality", "diet", "nhanes"]
    suppresses:
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_REDUCE_ALCOHOL"
    conflict_group: "DATA_QUALITY_DIET"
    conflict_policy: "keep_strongest"
    explanation_template: "Não existe recordatório alimentar Day 1 completo (24h) disponível. Recomendações alimentares (incluindo álcool) não foram calculadas."
    citations:
      - "https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DR1TOT_L.htm"
    provenance: 
      note: "NHANES DR1DRSTZ definition: code 5 = not done."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

  - rule_id: "ACUTE-0201"
    rule_version: "1.0.1"
    name: "Emergência combinada: crise hipertensiva + hiperglicemia severa"
    group: "SAFETY"
    priority: 1100
    condition: "Adult18plus_flag == 1 and (((notna(SBP_mean) and SBP_mean >= 180) or (notna(DBP_mean) and DBP_mean >= 120) or (notna(Hypertensive_crisis_flag) and Hypertensive_crisis_flag == 1)) and ((notna(LBXGH) and LBXGH >= 10) or (notna(Severe_hyperglycemia_flag) and Severe_hyperglycemia_flag == 1)))"
    missing_policy: "na_false"
    severity: "critical"
    action_type: "escalate"
    action_code: "ESCALATE_EMERGENCY_HTN_DM"
    tags: ["acute", "safety", "htn", "diabetes"]
    suppresses:
      - "ESCALATE_HTN_CRISIS"
      - "ESCALATE_SEVERE_HYPERGLYCEMIA"
      - "ESCALATE_HTN_MARKEDLY_ELEVATED"
      - "INFORM_BP_MEASUREMENT_LIMITED"
      - "INFORM_DIET_RECALL_NOT_RELIABLE"
      - "INFORM_DIET_DATA_MISSING"
      - "INFORM_BP_METHOD_INFERRED"
      - "INFORM_DATA_MISSING_KEY_METRICS"
      - "RECOMMEND_HTN_ST2_CLINIC_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_DIABETES_REVIEW_1M"
      - "RECOMMEND_HTN_ST1_LIFESTYLE_3_6M"
      - "RECOMMEND_BP_ELEVATED_LIFESTYLE_3_6M"
      - "INFORM_BP_NORMAL_MAINTAIN_ANNUAL"
      - "RECOMMEND_BP_SELF_MONITORING"
      - "RECOMMEND_DIABETES_SELF_MANAGEMENT_CORE"
      - "RECOMMEND_DIABETES_REVIEW_ABOVE_TARGET"
      - "RECOMMEND_DIABETES_REVIEW_POOR_CONTROL"
      - "RECOMMEND_PREDIABETES_LIFESTYLE"
      - "INFORM_NORMAL_GLYCEMIA_PREVENTION"
      - "ESCALATE_SEVERE_OBESITY_INTENSIVE_REFERRAL"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OBESITY"
      - "RECOMMEND_WEIGHT_MANAGEMENT_OVERWEIGHT"
      - "INFORM_CENTRAL_OBESITY_RISK"
      - "INFORM_VERY_HIGH_SODIUM_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_WHO_2000_DAY1"
      - "RECOMMEND_SODIUM_REDUCTION_1500_IDEAL_HIGH_RISK_DAY1"
      - "INFORM_LOW_POTASSIUM_SODIUM_RATIO_CAUTIOUS"
      - "RECOMMEND_INCREASE_DIETARY_FIBER_DENSITY"
      - "RECOMMEND_REDUCE_SATURATED_FAT"
      - "RECOMMEND_DASH_OR_MEDITERRANEAN_PATTERN"
      - "RECOMMEND_MVPA_START_GRADUAL"
      - "RECOMMEND_REDUCE_SEDENTARY_TIME"
      - "INFORM_OLDER_ADULTS_BALANCE_STRENGTH"
      - "RECOMMEND_SMOKING_CESSATION"
      - "INFORM_FORMER_SMOKER_REINFORCE"
      - "RECOMMEND_REDUCE_ALCOHOL"
      - "RECOMMEND_LIPIDS_HIGH_TC_LIFESTYLE"
      - "INFORM_LIPIDS_BORDERLINE_TC"
      - "RECOMMEND_LIPIDS_LOW_HDL_LIFESTYLE"
      - "RECOMMEND_INTEGRATED_CARDIOMETABOLIC_PLAN"
      - "ESCALATE_MULTI_MORBIDITY_HIGH_SEVERITY"
      - "RECOMMEND_LIFESTYLE_RISK_BUNDLE"
    conflict_group: "ACUTE_EMERGENCY"
    conflict_policy: "keep_strongest"
    explanation_template: "Valores sugerem crise hipertensiva e hiperglicemia severa. Procure avaliação urgente/emergência (112). Não adie cuidados."
    citations:
      - "https://www.heart.org/en/health-topics/high-blood-pressure/when-high-blood-pressure-is-an-emergency"
      - "https://www.heart.org/-/media/files/health-topics/high-blood-pressure/hypertension-guideline-highlights-flyer.pdf"
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690185/"
    provenance: 
      note: "Safety-first escalation combining ACC/AHA hypertensive crisis thresholds and ADA severe hyperglycemia guidance (A1C >10%)."
    created_by: "thesis_ruleset_generator"
    created_at: "2026-03-16T00:00:00Z"
    enabled: true

