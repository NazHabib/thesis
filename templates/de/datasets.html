{% extends "base.html" %}
{% block title %}Datasets{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
  <h2>Datasets</h2>
  <a class="btn btn-primary" href="{% url 'de:dataset_create' %}">New Dataset</a>
</div>

{% if datasets %}
  <div class="list-group mt-3">
    {% for ds in datasets %}
      <a class="list-group-item list-group-item-action" href="{% url 'de:dataset_detail' ds.id %}">
        <strong>{{ ds.name }}</strong>
        <div class="text-muted"><small>{{ ds.created_at }}</small></div>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p class="mt-3">No datasets yet.</p>
{% endif %}
{% endblock %}
