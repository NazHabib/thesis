{% extends "base.html" %}
{% block title %}Recommendation History{% endblock %}
{% block content %}
<h2>Recommendation History</h2>

{% if runs %}
  <div class="list-group">
    {% for run in runs %}
      <a class="list-group-item list-group-item-action" href="{% url 'recs:detail' run.id %}">
        <div class="d-flex justify-content-between">
          <strong>Run #{{ run.id }}</strong>
          <span class="text-muted">{{ run.created_at }}</span>
        </div>
        <small class="text-muted">Engine: {{ run.engine_version }}</small>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p>No runs yet.</p>
{% endif %}
{% endblock %}
