{% extends "base.html" %}
{% block title %}Edit Account Information{% endblock %}

{% block content %}
<div class="hero-card mb-4">
  <div class="d-flex flex-column flex-lg-row justify-content-between gap-3">
    <div>
      <p class="muted-label mb-1">Account information</p>
      <h2 class="mb-2">Edit Account Information</h2>
      <p class="text-muted mb-0">
        Update your basic account details.
      </p>
    </div>
    <div>
      <a class="btn btn-outline-secondary" href="{% url 'user:profile' %}">Back to profile</a>
    </div>
  </div>
</div>

<form method="post" class="soft-card">
  {% csrf_token %}

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Username</label>
      <input class="form-control" value="{{ user.username }}" disabled>
      <div class="form-text">Username changes are not available from this page.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" value="{{ user.email }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">First name</label>
      <input class="form-control" name="first_name" value="{{ user.first_name }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Last name</label>
      <input class="form-control" name="last_name" value="{{ user.last_name }}">
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mt-4">
    <button class="btn btn-primary" type="submit">Save account information</button>
    <a class="btn btn-outline-secondary" href="{% url 'user:profile' %}">Cancel</a>
  </div>
</form>
{% endblock %}
