{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h2>My Profile</h2>

<form method="post" class="card shadow-sm p-3">
  {% csrf_token %}

  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Date of birth</label>
      <input class="form-control" type="date" name="date_of_birth" value="{{ profile.date_of_birth|date:'Y-m-d' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Sex</label>
      <input class="form-control" name="sex" value="{{ profile.sex }}">
    </div>
  </div>

  <hr>

  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="has_dm" id="has_dm" {% if profile.has_dm %}checked{% endif %}>
    <label class="form-check-label" for="has_dm">Diabetes Mellitus (DM)</label>
  </div>

  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="has_htn" id="has_htn" {% if profile.has_htn %}checked{% endif %}>
    <label class="form-check-label" for="has_htn">Hypertension (HTN)</label>
  </div>

  <hr>

  <h5>Targets (optional)</h5>
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Glucose min</label>
      <input class="form-control" name="target_glucose_min" value="{{ profile.target_glucose_min|default_if_none:'' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">Glucose max</label>
      <input class="form-control" name="target_glucose_max" value="{{ profile.target_glucose_max|default_if_none:'' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">BP systolic</label>
      <input class="form-control" name="target_bp_sys" value="{{ profile.target_bp_sys|default_if_none:'' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">BP diastolic</label>
      <input class="form-control" name="target_bp_dia" value="{{ profile.target_bp_dia|default_if_none:'' }}">
    </div>
  </div>

  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'user:dashboard' %}">Back</a>
  </div>
</form>
{% endblock %}
